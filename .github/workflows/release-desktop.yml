name: Release Desktop

# Tavo desktop is macOS-only (CoreAudio/objc2), so there are no Linux or
# Windows builds. One `v*` tag releases every app: this workflow and the browser-extension
# release workflow both trigger on it and attach their assets to the same
# GitHub release. The version is bumped everywhere by `pnpm release:tag`
# (root package.json -> brand.json -> tauri.conf.json via sync-brand).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # App name, slug, and version all come from brand.json / tauri.conf.json,
      # so this workflow needs no per-app edits.
      - name: Read app version and brand
        id: brand
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app_name=$(node -p "require('./brand.json').appName")" >> "$GITHUB_OUTPUT"
          echo "slug=$(node -p "require('./brand.json').slug")" >> "$GITHUB_OUTPUT"

      - name: Build and release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "${{ steps.brand.outputs.app_name }} Desktop v__VERSION__"
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Build only
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target aarch64-apple-darwin

      - name: Upload .dmg (macOS)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.brand.outputs.slug }}-macos-v${{ steps.brand.outputs.version }}.dmg
          path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  update-homebrew-cask:
    needs: release-macos
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read app version and brand
        id: brand
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app_name=$(node -p "require('./brand.json').appName")" >> "$GITHUB_OUTPUT"
          echo "slug=$(node -p "require('./brand.json').slug")" >> "$GITHUB_OUTPUT"

      - name: Compute DMG sha256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release is still a draft, so download via authenticated gh cli instead of the public URL
          gh release download "v${{ steps.brand.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.brand.outputs.app_name }}_${{ steps.brand.outputs.version }}_aarch64.dmg" \
            --output dmg
          sha256=$(shasum -a 256 dmg | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update cask
        run: |
          version="${{ steps.brand.outputs.version }}"
          sha256="${{ steps.sha.outputs.sha256 }}"
          cask="Casks/${{ steps.brand.outputs.slug }}.rb"
          sed -i "s/version \".*\"/version \"$version\"/" "$cask"
          sed -i "s/sha256 .*/sha256 \"$sha256\"/" "$cask"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- "Casks/${{ steps.brand.outputs.slug }}.rb" && exit 0
          git add "Casks/${{ steps.brand.outputs.slug }}.rb"
          git commit -m "chore(desktop): update homebrew cask to v${{ steps.brand.outputs.version }}"
          git push origin HEAD:main

  sync-updater-notes:
    # tauri-action snapshots an empty body into latest.json's notes, so the
    # update dialog would be blank. Fill them from the changelog page content
    # (apps/web/src/content/changelog.ts); release:tag refuses to tag without
    # an entry. The manifest isn't signed (signatures cover the installers).
    needs: release-macos
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync latest.json notes from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          node scripts/compose-release-notes.mjs "$TAG" "$work/body.md" "$work/notes.txt"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern latest.json --output "$work/latest.json"
          jq -e '.version and (.platforms | length > 0)' "$work/latest.json" >/dev/null
          mkdir -p "$work/upload"
          jq --arg notes "$(cat "$work/notes.txt")" '.notes = $notes' \
            "$work/latest.json" > "$work/upload/latest.json"
          gh release upload "$TAG" --repo "${{ github.repository }}" \
            --clobber "$work/upload/latest.json"
