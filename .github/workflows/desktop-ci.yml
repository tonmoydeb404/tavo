name: Desktop CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "packages/ui/**"
      - "packages/brand/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "brand.json"
      - "public/logo.svg"
      - "scripts/sync-brand.mjs"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/ui/**"
      - "packages/brand/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "brand.json"
      - "public/logo.svg"
      - "scripts/sync-brand.mjs"
      - ".github/workflows/desktop-ci.yml"

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Brand sync check
        run: pnpm sync-brand:check

      - name: Typecheck
        run: pnpm --filter @workspace/desktop typecheck

      - name: Lint
        run: pnpm --filter @workspace/desktop lint

      - name: Build frontend
        run: pnpm --filter @workspace/desktop build

  rust:
    # The backend depends on macOS-only crates (objc2, CoreAudio), so it can
    # only be compiled and linted on a macOS runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/desktop build

      - name: Rust fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --quiet
