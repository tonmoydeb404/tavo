[package]
name = "tavo"
version = "1.2.0"
description = "Menu-bar audio control for macOS — switch devices, mute the mic, route app audio."
authors = ["Tonmoy Deb"]
homepage = "https://tonmoydeb.com"
repository = "https://github.com/tonmoydeb404/tavo"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tavo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
objc2-core-audio = { version = "0.3", features = [
    "objc2",
    "objc2-foundation",
    "AudioHardware",
] }
objc2 = "0.6"
base64 = "0.22"
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", features = ["objc2"] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSWorkspace",
    "objc2-core-graphics",
] }
